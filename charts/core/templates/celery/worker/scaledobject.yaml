{{- $keda := .Values.celery.keda }}
{{- $type := $keda.type | default "redis" }}
{{- $fullname := include "core.fullname" . }}
{{- $workers := dict "defaultWorker" "default" "periodicWorker" "periodic" }}
{{- $anyEnabled := false }}
{{- range $worker, $queue := $workers }}
{{- if (index $.Values.celery $worker).keda.enabled }}
{{- $anyEnabled = true }}
{{- end }}
{{- end }}
{{- if $anyEnabled }}
{{- if not (has $type (list "redis" "rabbitmq")) }}
{{- fail (printf "celery.keda.type must be redis or rabbitmq, got %q" $type) }}
{{- end }}
{{- if and (eq $type "redis") (not $keda.address) }}
{{- fail "celery.keda.type=redis needs celery.keda.address" }}
{{- end }}
{{- if eq $type "rabbitmq" }}
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ $fullname }}-celery-worker
  labels:
    {{- include "core.labels" $ | nindent 4 }}
spec:
  secretTargetRef:
    - parameter: host
      name: {{ $keda.rabbitmq.secretName | default $.Values.keyvault.secretName | default "keyvault-secret" }}
      key: {{ $keda.rabbitmq.secretKey }}
{{- end }}
{{- end }}
{{- range $worker, $queue := $workers }}
{{- $cfg := index $.Values.celery $worker }}
{{- if $cfg.keda.enabled }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $fullname }}-celery-worker-{{ $queue }}
  labels:
    {{- include "core.labels" $ | nindent 4 }}
    core/service: celery-worker-{{ $queue }}
spec:
  scaleTargetRef:
    name: {{ $fullname }}-celery-worker-{{ $queue }}
  pollingInterval: {{ $keda.pollingInterval }}
  cooldownPeriod: {{ $keda.cooldownPeriod }}
  minReplicaCount: {{ $cfg.keda.minReplicaCount }}
  maxReplicaCount: {{ $cfg.keda.maxReplicaCount }}
  {{- with $keda.behavior }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        {{- toYaml . | nindent 8 }}
  {{- end }}
  triggers:
    {{- if eq $type "rabbitmq" }}
    - type: rabbitmq
      metadata:
        protocol: {{ $keda.rabbitmq.protocol | quote }}
        queueName: {{ $queue | quote }}
        mode: QueueLength
        value: {{ $cfg.keda.listLength | quote }}
      authenticationRef:
        name: {{ $fullname }}-celery-worker
    {{- else }}
    - type: redis
      metadata:
        address: {{ $keda.address | quote }}
        databaseIndex: {{ $keda.databaseIndex | quote }}
        enableTLS: {{ $keda.enableTLS | quote }}
        listName: {{ $queue | quote }}
        listLength: {{ $cfg.keda.listLength | quote }}
    {{- end }}
{{- end }}
{{- end }}
