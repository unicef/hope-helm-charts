{{- if include "reporting.pqRunner.enabled" . }}
{{- include "reporting.pqRunner.validate" . }}
{{- if .Values.pqRunner.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "reporting.pqRunner.serviceAccountName" . }}
  labels:
    {{- include "reporting.pqRunner.labels" . | nindent 4 }}
  {{- with .Values.pqRunner.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
