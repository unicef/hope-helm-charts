# Default values for reporting.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: unicef/hope-support-images
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

global:
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

ingress:
  enabled: true
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  host: chart-example.local
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

backend:
  replicaCount: 2

  service:
    type: ClusterIP
    port: 8000

celery:
  replicaCount: 1

  # Unset = Kubernetes default (30s)
  terminationGracePeriodSeconds: null

  # KEDA queue-depth scaling for the worker (needs KEDA in the cluster)
  keda:
    enabled: false
    address: ""  # redis host:port
    databaseIndex: "0"
    enableTLS: false
    listName: queue_hcr  # celery queue
    pollingInterval: 30
    cooldownPeriod: 300
    minReplicaCount: 1
    maxReplicaCount: 4
    listLength: 5  # queued tasks per replica
    behavior: {}
  # Resources for the celery worker (and beat, unless beatResources is set)
  resources: {}
  # Optional override for celery beat; falls back to celery.resources
  beatResources: {}

# Dedicated Celery worker for user Python code (POWER_QUERY_EXECUTION_MODE=runner).
# Isolated from the backend: it never gets the backend Secret or ConfigMap, only
# its own ConfigMap (backendConfigKeys + config) and its own Key Vault Secret.
# Nothing is rendered while disabled. See README.md before enabling.
pqRunner:
  enabled: false

  # Used when keda.enabled is false
  replicaCount: 1

  # Empty fields fall back to image.repository / image.tag / global.imagePullPolicy
  image:
    repository: ""
    tag: ""
    pullPolicy: ""

  # Required when enabled; to be provided by the country-report developers.
  # The chart does not add the queue to the command: it must be part of command/args.
  command: []
  args: []
  queue: ""  # runner Celery queue; must differ from celery.keda.listName

  # Unset = Kubernetes default (30s)
  terminationGracePeriodSeconds: null

  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Non-secret env for the runner ConfigMap: keys copied from backend.config
  # (allowlist, each must exist there) and runner-only values. config wins on conflict.
  backendConfigKeys: []
  config: {}

  # Own SecretProviderClass + Secret through the keyvault library chart.
  # name/tenantId/userAssignedIdentityID fall back to the top-level keyvault block;
  # envMappings never do. Mailjet/Azure/static-storage/Flower keys (and backend objects
  # feeding them) are rejected; the backend's database, SECRET_KEY and
  # FILE_STORAGE_MEDIA/DEFAULT/HOPE objects can be reused (Key Vault only).
  keyvault:
    enabled: true
    resourceName: ""  # default "<fullname>-pq-runner" -> "<fullname>-pq-runner-secret-provider"
    secretName: ""    # default "<fullname>-pq-runner-secret"
    mountPath: /mnt/secrets
    name: ""
    tenantId: ""
    userAssignedIdentityID: ""
    envMappings: []

  # KEDA queue-depth scaling (needs KEDA in the cluster). Empty address,
  # databaseIndex and enableTLS fall back to celery.keda; listName to queue.
  keda:
    enabled: false
    address: ""
    databaseIndex: ""
    enableTLS: null
    listName: ""
    pollingInterval: 30
    cooldownPeriod: 300
    # keep >= 1: the Key Vault Secret is synced only while a pod mounts it
    minReplicaCount: 1
    maxReplicaCount: 4
    listLength: 5  # queued tasks per replica
    behavior: {}

  # Always a dedicated ServiceAccount; neither it nor the pod mounts an API token
  serviceAccount:
    create: true
    name: ""  # required when create is false; must not be "default" or the backend's
    annotations: {}

  # Only these ids are configurable (non-zero). The rest of the pod and container
  # security context is fixed by the chart: runAsNonRoot, RuntimeDefault seccomp,
  # readOnlyRootFilesystem, no privilege escalation, not privileged, drop ALL.
  podSecurityContext:
    runAsUser: 1030
    runAsGroup: 1030
    fsGroup: 1030

  # Writable /tmp on a read-only root filesystem
  tmpVolume:
    enabled: true
    mountPath: /tmp
    medium: ""
    sizeLimit: ""

  # Further writable paths (confirm with developers). Only {name, emptyDir}
  # volumes are allowed: no Secret, ConfigMap, CSI, projected or hostPath.
  extraVolumes: []
  # - name: home
  #   emptyDir: {}
  extraVolumeMounts: []
  # - name: home
  #   mountPath: /home/app

keyvault:
  enabled: true
  mountPath: /mnt/secrets
  secretName: "keyvault-secret"

flower:
  enabled: false

  service:
    type: ClusterIP
    port: 5555

redis:
  enabled: true
  image:
    registry: docker.io
    repository: redis
    tag: "8"
  auth:
    enabled: false

  # Use custom config (no loadmodule) for official redis:8 — same as pipelines/redis/cd/stg.
  # Set master.extraVolumes in deploy values with configMap name "<release-name>-redis-config".
  master:
    count: 1
    command: ["redis-server"]
    args: ["/config/redis.conf"]
    extraVolumeMounts:
      - name: redis-conf
        mountPath: /config
        readOnly: true
    containerSecurityContext:
      runAsNonRoot: true
      runAsUser: 999
      allowPrivilegeEscalation: false
    podSecurityContext:
      fsGroup: 999

  replica:
    replicaCount: 1
    command: ["redis-server"]
    args: ["/config/redis.conf"]
    extraVolumeMounts:
      - name: redis-conf
        mountPath: /config
        readOnly: true
    containerSecurityContext:
      runAsNonRoot: true
      runAsUser: 999
      allowPrivilegeEscalation: false
    podSecurityContext:
      fsGroup: 999

postgresql:
  enabled: true
  auth:
    username: "reporting"
    password: ""
    database: "reporting"
    postgresPassword: ""
  primary:
    initdb:
      user: postgres
      password: ""
      scripts:
        init.sql: |
          CREATE EXTENSION IF NOT EXISTS postgis;

rollme:
  enabled: false