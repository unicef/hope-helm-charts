{{- with .Values.celery.keda }}
{{- if .enabled }}
{{- $type := .type | default "redis" }}
{{- if not (has $type (list "redis" "rabbitmq")) }}
{{- fail (printf "celery.keda.type must be redis or rabbitmq, got %q" $type) }}
{{- end }}
{{- if and (eq $type "redis") (not .address) }}
{{- fail "celery.keda.type=redis needs celery.keda.address" }}
{{- end }}
{{- $fullname := include "aurora.fullname" $ }}
{{- if eq $type "rabbitmq" }}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ $fullname }}-celery-worker
  labels:
    {{- include "aurora.labels" $ | nindent 4 }}
spec:
  secretTargetRef:
    - parameter: host
      name: {{ .rabbitmq.secretName | default $.Values.keyvault.secretName | default "keyvault-secret" }}
      key: {{ .rabbitmq.secretKey }}
---
{{- end }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $fullname }}-celery-worker
  labels:
    {{- include "aurora.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ $fullname }}-celery-worker
  pollingInterval: {{ .pollingInterval }}
  cooldownPeriod: {{ .cooldownPeriod }}
  minReplicaCount: {{ .minReplicaCount }}
  maxReplicaCount: {{ .maxReplicaCount }}
  {{- with .behavior }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        {{- toYaml . | nindent 8 }}
  {{- end }}
  triggers:
    {{- if eq $type "rabbitmq" }}
    - type: rabbitmq
      metadata:
        protocol: {{ .rabbitmq.protocol | quote }}
        queueName: {{ .rabbitmq.queueName | default .listName | quote }}
        mode: QueueLength
        value: {{ .listLength | quote }}
      authenticationRef:
        name: {{ $fullname }}-celery-worker
    {{- else }}
    - type: redis
      metadata:
        address: {{ .address | quote }}
        databaseIndex: {{ .databaseIndex | quote }}
        enableTLS: {{ .enableTLS | quote }}
        listName: {{ .listName | quote }}
        listLength: {{ .listLength | quote }}
    {{- end }}
{{- end }}
{{- end }}
