# Default values for aurora.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: unicef/hope-aurora
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

keyvault:
  enabled: true
  envMappings: []
  mountPath: /mnt/secrets
  secretName: "keyvault-secret"

volumes: []

volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}

redis:
  enabled: true
  image:
    registry: docker.io
    repository: redis
    tag: "8"
  architecture: standalone
  replica:
    replicaCount: 0
  auth:
    enabled: false

  # Use custom config (no loadmodule) for official redis:8 — same as pipelines/redis/cd/stg.
  # Set master.extraVolumes in deploy values with configMap name "<release-name>-redis-config".
  master:
    command: ["redis-server"]
    args: ["/config/redis.conf"]
    extraVolumeMounts:
      - name: redis-conf
        mountPath: /config
        readOnly: true
    containerSecurityContext:
      runAsNonRoot: true
      runAsUser: 999
      allowPrivilegeEscalation: false
    podSecurityContext:
      fsGroup: 999

postgresql:
  enabled: true
  auth:
    username: "aurora"
    password: ""
    database: "aurora"
    postgresPassword: ""
  primary:
    initdb:
      user: postgres
      password: ""

celery:
  enabled: false
  replicaCount: 1

  # Unset = Kubernetes default (30s)
  terminationGracePeriodSeconds: null

  # KEDA queue-depth scaling for the worker (needs KEDA in the cluster).
  # START_WORKER runs dramatiq (circus.ini), whose redis broker keeps each queue as list dramatiq:<queue>
  keda:
    enabled: false
    address: ""  # redis host:port
    databaseIndex: "0"
    enableTLS: false
    listName: "dramatiq:default"
    pollingInterval: 30
    cooldownPeriod: 300
    minReplicaCount: 1
    maxReplicaCount: 4
    listLength: 32  # queued tasks per replica = dramatiq processes (4) x threads (8)
    behavior: {}
  beatEnabled: true
  # Resources for the celery worker (and beat, unless beatResources is set);
  # falls back to the top-level resources
  resources: {}
  # Optional override for celery beat; falls back to celery.resources, then resources
  beatResources: {}
  args: ["run"]
  beatArgs: ["run"]

streaming:
  enabled: false
  replicaCount: 1
  args: ["streaming"]
  # Falls back to the top-level resources
  resources: {}
  livenessProbe: {}
  readinessProbe: {}

rollme:
  enabled: false